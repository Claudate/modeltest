[package]
name = "model-test"
version = "0.1.3"
edition = "2021"
description = "中转站模型验证工具 — 列出并校验中转站上的模型是否可用"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", features = ["glow"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"